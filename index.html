<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100">

    <div class="bg-white max-w-md mx-auto rounded-lg p-5 m-5 border border-e-emerald-500">
        <div class="bg-indigo-500 p-5 text-white  block rounded-sm">
            <h1 class="text-center"> DISCO TODO APP</h1>

        </div>

        <div class=" p-5">
            <form id="todo-form" action="" class=" 
          flex todo-form gap-5">
                <input id="todo-input" placeholder="Enter task description"
                    class=" text-input   flex-1 border  border-black-500 rounded-sm p-2" type="text">
                <button id="form-btn" class="px-8 text-white py-3 bg-violet-700 rounded-lg ">Add</button>
            </form>

            <div class="flex  justify-between py-5 text-xs border-b border-b-indigo-500 pt-6 pb-1 border-black">
                <p id="task-count" class=" font-bold  text-gray-700">TASK (0)</p>
                <p id="tsak-copmleted" class=" font-bold text-gray-700">COMPLETED : (0)</p>
            </div>


            <ul class="py-5 flex flex-col " id="todo-list" >
                <!-- <li data-id="1" class="mt-2 flex gap-2 border border-slate-300 p-4 rounded-lg bg-white overflow-hidden">
</li> -->

                <li data-id="1" class="   mt-2 flex gap-2 border  border-slate-300 p-4 rounded-lg overflow-hidden">
                    <input type="checkbox">
                    <p class="flex-1 ">Go to gym </p>
                    <div class="flex gap-2">
                        <div class="border border-black bg-red-500 " >
                        <button data-id="1" >Edit</button>
                    </div>

                    <div>
                          <button data-id="1">Delete</button>
                    </div>
                      
                    </div>
                </li>
            </ul>

        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
